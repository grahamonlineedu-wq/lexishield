<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiShield - AI Legal Document Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold tracking-tight text-blue-400">LexiShield</h1>
      <p class="text-sm text-slate-400 mt-1">AI-Powered Legal Document Risk & Clause Analyzer</p>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Input Column -->
      <div class="space-y-4">
        <label for="docText" class="block text-sm font-semibold text-slate-300">Document Content</label>
        <textarea id="docText" rows="12" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500" placeholder="Paste your legal document, contract, or agreement text here..."></textarea>
        <button id="analyzeBtn" onclick="analyzeDoc()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-lg shadow-blue-600/20">
          Analyze Document
        </button>
      </div>

      <!-- Output Column -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-5 space-y-4 min-h-[300px]">
        <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Analysis Results</h2>

        <!-- Initial Placeholder -->
        <div id="placeholder" class="text-slate-500 text-sm italic py-10 text-center">
          Paste a document and click analyze to view risk assessment.
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center py-10 text-blue-400 font-medium animate-pulse">
          Analyzing document structure and risk factors...
        </div>

        <!-- Results Display -->
        <div id="results" class="hidden space-y-4">
          <div>
            <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">Risk Assessment</span>
            <span id="riskBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold"></span>
          </div>

          <div>
            <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">Summary</span>
            <p id="summaryText" class="text-sm text-slate-300 bg-slate-900/50 p-3 rounded border border-slate-700/50"></p>
          </div>

          <div>
            <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">Flags & Issues</span>
            <ul id="flagsList" class="list-disc list-inside text-sm text-amber-300 space-y-1"></ul>
          </div>

          <div>
            <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">Missing Clauses</span>
            <ul id="missingList" class="list-disc list-inside text-sm text-rose-300 space-y-1"></ul>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function analyzeDoc() {
      const text = document.getElementById('docText').value;
      const btn = document.getElementById('analyzeBtn');
      const placeholder = document.getElementById('placeholder');
      const loader = document.getElementById('loader');
      const results = document.getElementById('results');

      if (!text || text.trim().length < 20) {
        alert('Please enter at least 20 characters of document text.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');
      placeholder.classList.add('hidden');
      results.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
        const response = await fetch('/api/v1/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ documentText: text })
        });

        const res = await response.json();

        if (res.status === 'success') {
          const data = res.data;
          
          // Risk Badge Color
          const badge = document.getElementById('riskBadge');
          badge.textContent = data.risk_score || 'Unknown';
          const score = (data.risk_score || '').toLowerCase();
          if (score.includes('high')) badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30';
          else if (score.includes('medium')) badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
          else badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';

          // Summary
          document.getElementById('summaryText').textContent = data.summary || 'No summary provided.';

          // Flags
          const flagsList = document.getElementById('flagsList');
          flagsList.innerHTML = '';
          (data.flags || []).forEach(flag => {
            const li = document.createElement('li');
            li.textContent = flag;
            flagsList.appendChild(li);
          });
          if ((data.flags || []).length === 0) flagsList.innerHTML = '<li class="text-slate-500 italic font-normal">None identified</li>';

          // Missing Clauses
          const missingList = document.getElementById('missingList');
          missingList.innerHTML = '';
          (data.missing_clauses || []).forEach(clause => {
            const li = document.createElement('li');
            li.textContent = clause;
            missingList.appendChild(li);
          });
          if ((data.missing_clauses || []).length === 0) missingList.innerHTML = '<li class="text-slate-500 italic font-normal">None missing</li>';

          results.classList.remove('hidden');
        } else {
          alert('Error: ' + (res.error || 'Failed to analyze document.'));
          placeholder.classList.remove('hidden');
        }
      } catch (err) {
        alert('Request failed: ' + err.message);
        placeholder.classList.remove('hidden');
      } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>

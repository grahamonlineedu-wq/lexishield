<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiShield 🛡️ | Contract Risk Audit</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    textarea {
      width: 100%;
      height: 200px;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #results { margin-top: 30px; display: none; }
    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }
    .score-High { color: var(--danger); }
    .score-Medium { color: var(--warning); }
    .score-Low { color: var(--success); }
    .flag {
      border-left: 4px solid var(--warning);
      padding-left: 12px;
      margin: 10px 0;
    }
    .flag.Critical { border-color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span style="font-size: 2rem;">🛡️</span>
      <div>
        <h1>LexiShield AI</h1>
        <small style="color: #94a3b8;">Commercial Contract Risk & Compliance Scanner</small>
      </div>
    </header>

    <label for="docText"><strong>Paste Contract or Agreement Text:</strong></label>
    <textarea id="docText" placeholder="Paste freelance agreement, NDA, or service contract here (min 50 characters)..."></textarea>
    <button id="scanBtn" onclick="runAudit()">Run Risk Audit</button>

    <div id="results">
      <div class="card">
        <h3>Risk Score: <span id="riskScore"></span></h3>
        <p id="summary"></p>
      </div>

      <div class="card">
        <h3>Risk Flags Identified</h3>
        <div id="flagsList"></div>
      </div>

      <div class="card">
        <h3>Missing Standard Clauses</h3>
        <ul id="missingList"></ul>
      </div>
    </div>
  </div>

  <script>
    async function runAudit() {
      const text = document.getElementById('docText').value;
      const btn = document.getElementById('scanBtn');
      const resultsDiv = document.getElementById('results');

      if (text.trim().length < 50) {
        alert('Please enter at least 50 characters to run an audit.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Analyzing with LexiShield...';
      resultsDiv.style.display = 'none';

      try {
        const response = await fetch('/api/v1/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ documentText: text })
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.error || 'Audit failed');

        const data = result.data;
        document.getElementById('riskScore').innerText = data.risk_score;
        document.getElementById('riskScore').className = 'score-' + data.risk_score;
        document.getElementById('summary').innerText = data.summary;

        // Populate Flags
        const flagsList = document.getElementById('flagsList');
        flagsList.innerHTML = '';
        data.flags.forEach(f => {
          flagsList.innerHTML += `
            <div class="flag ${f.severity}">
              <strong>[${f.severity}] ${f.clause}</strong>
              <p style="margin: 4px 0;">${f.issue}</p>
              <small style="color: var(--accent);">Recommendation: ${f.recommendation}</small>
            </div>
          `;
        });

        // Populate Missing Clauses
        const missingList = document.getElementById('missingList');
        missingList.innerHTML = '';
        data.missing_clauses.forEach(m => {
          missingList.innerHTML += `<li>${m}</li>`;
        });

        resultsDiv.style.display = 'block';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Run Risk Audit';
      }
    }
  </script>
</body>
</html>
